[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tidepool"
version = "0.1.0"
description = "A toy box for the Jumper crab robot: write a few lines of YAML, get a physics scene to play in"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tidepool = "tidepool.cli:main"

[tool.setuptools.packages.find]
include = ["tidepool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
